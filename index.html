<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>このゲームは広告です。</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;user-select:none}
[hidden]{display:none!important}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;container-type:size;overflow:hidden;overflow:clip;background:#000;color:#fff}
.layer{position:absolute;inset:0}
#bg svg{width:100%;height:100%;display:block}
#sprite{position:absolute;left:50%;top:7cqh;height:100cqh;aspect-ratio:300/620;transform:translateX(-50%);transition:transform .35s,opacity .3s;pointer-events:none;filter:drop-shadow(0 .4cqw 1cqw rgba(0,0,0,.35))}
#sprite.side{transform:translateX(-115%)}
#sprite.off{opacity:0}
#sprite svg{width:100%;height:100%}
/* HUD */
#hud{position:absolute;top:1.2cqw;left:1.5cqw;right:1.5cqw;display:flex;justify-content:space-between;align-items:center;font-size:1.7cqw;font-weight:bold;pointer-events:none}
#hud>div{background:rgba(20,24,50,.78);border:.15cqw solid rgba(255,255,255,.6);border-radius:10cqw;padding:.5cqw 1.5cqw;display:flex;align-items:center;gap:1cqw}
#fbar{width:14cqw;height:1.1cqw;background:#3a2a3a;border-radius:1cqw;overflow:hidden}
#fbar i{display:block;height:100%;background:linear-gradient(90deg,#ff7aa2,#ff3c6f);transition:width .5s}
#toast{position:absolute;top:6cqw;right:4cqw;font-size:3cqw;font-weight:bold;color:#ff5c8a;text-shadow:0 0 .4cqw #fff,0 0 .4cqw #fff;opacity:0;pointer-events:none}
#toast.go{animation:toast 1.4s ease-out}
@keyframes toast{0%{opacity:0;transform:translateY(2cqw)}20%{opacity:1}100%{opacity:0;transform:translateY(-3cqw)}}
#sys{position:absolute;left:50%;top:1.2cqw;transform:translateX(-50%);z-index:30;display:flex;gap:.8cqw}
#sys button{font:inherit;font-size:1.6cqw;font-weight:bold;background:rgba(20,24,50,.78);color:#fff;border:.15cqw solid rgba(255,255,255,.6);border-radius:10cqw;padding:.4cqw 1.4cqw;cursor:pointer}
#sys button:hover{background:rgba(70,80,160,.95)}
/* gallery */
#gal{z-index:14;background:#141832;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw}
#gal h2{font-size:2.6cqw;letter-spacing:.2em;color:#ffd400}
#galGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:1.4cqw;width:92cqw}
.gc{width:24cqw;background:#232a5c;border:.2cqw solid #fff;border-radius:1cqw;overflow:hidden;color:#fff;font:inherit;padding:0;text-align:center}
.gc.open{cursor:pointer}.gc.open:hover{border-color:#ffd400;transform:translateY(-.3cqw)}
.gc img{width:100%;aspect-ratio:16/9;display:block;object-fit:cover}
.gc .lock{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:5cqw;background:#0d1028;color:#445}
.gc b{display:block;font-size:1.45cqw;padding:.5cqw .5cqw .1cqw}
.gc small{display:block;font-size:1.05cqw;opacity:.8;padding:0 .5cqw .6cqw}
#galBack{font:inherit;font-size:1.8cqw;font-weight:bold;padding:.7cqw 3cqw;border-radius:5cqw;border:.2cqw solid #fff;background:#e63970;color:#fff;cursor:pointer}
/* textbox */
#tb{position:absolute;left:3cqw;right:3cqw;bottom:2cqw;height:27cqh;background:rgba(18,22,52,.88);border:.25cqw solid #ffd9e4;border-radius:1.5cqw;padding:2.6cqw 3cqw 1cqw;cursor:pointer}
#nm{position:absolute;left:2.5cqw;top:-2cqw;background:#ff5c8a;border:.2cqw solid #fff;border-radius:1cqw;padding:.3cqw 2cqw;font-size:2cqw;font-weight:bold}
#msg{font-size:2.3cqw;line-height:1.65;letter-spacing:.03em}
#nx{position:absolute;right:2cqw;bottom:1cqw;font-size:1.8cqw;color:#ffd400;animation:bob .8s infinite alternate}
@keyframes bob{to{transform:translateY(.5cqw)}}
/* choices */
#choices{position:absolute;right:6cqw;top:10cqh;width:48cqw;height:56cqh;display:flex;flex-direction:column;justify-content:center;gap:1.4cqw}
.ch{font:inherit;font-size:2.1cqw;font-weight:bold;color:#fff;background:rgba(30,36,80,.92);border:.2cqw solid #fff;border-radius:1.2cqw;padding:1.3cqw 2cqw;cursor:pointer;text-align:left;transition:transform .12s,background .12s}
.ch:hover{transform:translateX(-.6cqw);background:rgba(70,80,160,.95)}
.ch.adbtn{background:linear-gradient(90deg,#ffd400,#ff9a00);color:#3a1a00;border-color:#fff;font-size:2.4cqw;box-shadow:0 0 1.5cqw #ffd400;animation:pulse .7s infinite alternate;text-align:center}
.ch.adbtn small{display:block;font-size:1.4cqw}
@keyframes pulse{to{box-shadow:0 0 3cqw #ffea00,0 0 .6cqw #fff;transform:scale(1.03)}}
/* day card */
#card{background:#141832;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:5cqw;font-weight:bold;letter-spacing:.2em;opacity:0;pointer-events:none;transition:opacity .5s}
#card.on{opacity:1}
#card small{font-size:2cqw;color:#ffd400;margin-top:1.5cqw;letter-spacing:.1em}
/* ad */
#ad{background:#000;z-index:20}
#adcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4cqw}
#adcard .em{font-size:13cqw;line-height:1.1;animation:wig 1s infinite alternate}
@keyframes wig{from{transform:rotate(-5deg) scale(1)}to{transform:rotate(5deg) scale(1.08)}}
#adcard .br{font-size:2cqw;background:rgba(0,0,0,.3);padding:.3cqw 1.6cqw;border-radius:5cqw;margin-bottom:1cqw}
#adcard .hd{font-size:5cqw;font-weight:900;text-shadow:.25cqw .25cqw 0 rgba(0,0,0,.3);line-height:1.3}
#adcard .sb{font-size:1.7cqw;margin-top:1cqw;opacity:.9}
#adcard .cta{margin-top:2.5cqw;font:inherit;font-size:2.4cqw;font-weight:bold;border:0;border-radius:5cqw;padding:1cqw 4cqw;background:#fff;color:#222;cursor:pointer;animation:pulse .6s infinite alternate}
#adcard .me{height:52cqh;aspect-ratio:300/400;overflow:hidden}
#adcard .me svg{width:100%}
#adlabel{position:absolute;left:1.5cqw;top:1.5cqw;background:#ffd400;color:#000;font-size:1.5cqw;font-weight:bold;padding:.2cqw 1cqw;border-radius:.4cqw}
#adskip{position:absolute;right:1.5cqw;top:1.5cqw;font:inherit;font-size:1.8cqw;font-weight:bold;background:rgba(0,0,0,.7);color:#fff;border:.15cqw solid #fff;border-radius:.6cqw;padding:.6cqw 1.6cqw}
#adskip.ok{background:#fff;color:#000;cursor:pointer}
#adnote{position:absolute;left:0;right:0;bottom:2.2cqw;text-align:center;font-size:1.4cqw;opacity:.85}
#adprog{position:absolute;left:0;bottom:0;height:.8cqw;background:#ffd400;width:0}
/* title */
#title{background:linear-gradient(160deg,#ffe95c,#ffb23c 55%,#ff6f91);z-index:10;color:#3a1a2a}
#title .box{position:absolute;left:6cqw;top:12cqh;width:56cqw}
#title .tag{display:inline-block;background:#000;color:#ffd400;font-weight:bold;font-size:1.8cqw;padding:.2cqw 1.2cqw;border-radius:.4cqw}
#title h1{font-size:7.4cqw;line-height:1.2;font-weight:900;color:#fff;text-shadow:.35cqw .35cqw 0 #e63970,-.1cqw -.1cqw 0 #e63970,.6cqw .6cqw 0 rgba(0,0,0,.2);margin:1.5cqw 0}
#title p{font-size:2cqw;font-weight:bold;line-height:1.7}
#startBtn{margin-top:3cqw;font:inherit;font-size:3cqw;font-weight:900;color:#fff;background:#e63970;border:.35cqw solid #fff;border-radius:6cqw;padding:1.2cqw 5cqw;cursor:pointer;box-shadow:0 .6cqw 0 #a31f4b}
#startBtn:active{transform:translateY(.4cqw);box-shadow:0 .2cqw 0 #a31f4b}
#title .girl{position:absolute;right:4cqw;top:6cqh;height:105cqh;aspect-ratio:300/620}
#title .girl svg{width:100%;height:100%}
#ends{font-size:1.5cqw!important;margin-top:1.5cqw}
#banner{position:absolute;left:0;right:0;bottom:0;height:9cqh;background:#fff;color:#666;border-top:.2cqw solid #ccc;display:flex;align-items:center;justify-content:center;font-size:1.7cqw;gap:1.5cqw}
#banner b{background:#ffd400;color:#000;padding:.1cqw .8cqw;border-radius:.3cqw;font-size:1.3cqw}
/* ending */
#end{background:#000;z-index:15}
#end img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:cgin 1.2s}
@keyframes cgin{from{opacity:0;transform:scale(1.04)}}
#end img{cursor:pointer}
#end .panel{position:absolute;left:0;right:0;bottom:0;padding:3.5cqw 3cqw 1.5cqw;background:linear-gradient(transparent,rgba(10,12,30,.9) 50%);display:flex;align-items:flex-end;justify-content:space-between;gap:2cqw}
#end .k{font-size:1.6cqw;color:#ffd400;letter-spacing:.3em}
#end .n{font-size:3.6cqw;font-weight:900}
#end .s{font-size:1.5cqw;opacity:.9;margin-top:.3cqw}
#end button{font:inherit;font-size:1.9cqw;font-weight:bold;padding:.8cqw 3cqw;border-radius:5cqw;border:.2cqw solid #fff;background:#e63970;color:#fff;cursor:pointer;white-space:nowrap}
#title .row{display:flex;align-items:center;gap:1.2cqw;margin-top:2.4cqw;flex-wrap:wrap}
#title .row #startBtn{margin-top:0}
#title .sub{font:inherit;font-size:1.9cqw;font-weight:900;color:#e63970;background:#fff;border:.3cqw solid #e63970;border-radius:6cqw;padding:.8cqw 2.2cqw;cursor:pointer}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <div id="sprite" class="off"></div>
  <div id="hud"><div id="hudL"></div><div><span>♥</span><div id="fbar"><i></i></div><span id="fnum"></span><span id="adnum"></span></div></div>
  <div id="toast"></div>
  <div id="sys"><button id="home" hidden>🏠 ホーム</button><button id="mute">🔊</button></div>
  <div id="choices" hidden></div>
  <div id="tb"><div id="nm"></div><div id="msg"></div><div id="nx">▼</div></div>
  <div id="card" class="layer"><span id="cardT"></span><small id="cardS"></small></div>

  <div id="end" class="layer" hidden>
    <img id="endImg" alt="">
    <div class="panel" id="endPanel"><div><div class="k" id="endK"></div><div class="n" id="endN"></div><div class="s" id="endS"></div></div>
    <button id="endBtn">タイトルへ戻る</button></div>
  </div>

  <div id="gal" class="layer" hidden>
    <h2>エンディング一覧</h2><div id="galGrid"></div><button id="galBack">タイトルへ戻る</button>
  </div>

  <div id="title" class="layer">
    <div class="box">
      <span class="tag">広告</span>
      <h1>このゲームは<br>広告です。</h1>
      <p>広告を見てほしすぎる女の子と過ごす、7日間の恋愛シミュレーション。<br>※プレイ時間 約20分 ／ ゲーム内の広告はすべて架空です</p>
      <div class="row"><button id="startBtn">▶ はじめる</button><button id="contBtn" class="sub" hidden></button><button id="galBtn" class="sub">🖼 エンディング一覧</button></div>
      <p id="ends"></p>
    </div>
    <div class="girl" id="titleGirl"></div>
    <div id="banner"><b>広告</b>ここにバナー広告が入ります（予定地）</div>
  </div>

  <div id="ad" class="layer" hidden>
    <div id="adcard"></div>
    <div id="adlabel">広告</div>
    <button id="adskip"></button>
    <div id="adnote">※これは架空の広告です。実在の商品・サービスとは関係ありません。</div>
    <div id="adprog"></div>
  </div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const FAST=new URLSearchParams(location.search).has('fast');

/* =====================================================================
   立ち絵（SVG）
   ===================================================================== */
const SKIN='#ffe9dc',HAIR='#ff8fa3',HAIR2='#f06c88',LINE='#5a2a3a';
const EXP={
  normal:{eye:'n',brow:'n',mouth:'s',blush:.35},
  smile:{eye:'c',brow:'n',mouth:'o',blush:.5},
  ad:{eye:'star',brow:'n',mouth:'o',blush:.55},
  pout:{eye:'jito',brow:'a',mouth:'p',blush:.3},
  sad:{eye:'n',brow:'s',mouth:'sad',blush:.15},
  blush:{eye:'n',brow:'s',mouth:'w',blush:.95},
  surprise:{eye:'sup',brow:'n',mouth:'O',blush:.3},
  shy:{eye:'d',brow:'s',mouth:'w',blush:1}
};
function eyeSvg(t,cx){
  const lash=`<path d="M${cx-13} 158 Q${cx} 146 ${cx+13} 158" stroke="${LINE}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  const base=`<ellipse cx="${cx}" cy="166" rx="11" ry="14" fill="#fff"/><ellipse cx="${cx}" cy="167" rx="9.5" ry="12.5" fill="#c23a5e"/>`;
  if(t==='c')return `<path d="M${cx-12} 168 Q${cx} 154 ${cx+12} 168" stroke="${LINE}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  if(t==='d')return `<path d="M${cx-12} 163 Q${cx} 173 ${cx+12} 163" stroke="${LINE}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  if(t==='star')return base+`<path d="M${cx} 156 L${cx+3} 164 L${cx+10} 167 L${cx+3} 170 L${cx} 178 L${cx-3} 170 L${cx-10} 167 L${cx-3} 164Z" fill="#ffe45c"/>`+lash;
  if(t==='sup')return `<ellipse cx="${cx}" cy="166" rx="12" ry="15" fill="#fff" stroke="${LINE}" stroke-width="1.5"/><circle cx="${cx}" cy="167" r="5.5" fill="#7a1f3d"/>`;
  const full=base+`<ellipse cx="${cx}" cy="170" rx="5.5" ry="8" fill="#6a1836"/><circle cx="${cx-3.5}" cy="161" r="3.3" fill="#fff"/><circle cx="${cx+4}" cy="173" r="1.6" fill="#ffd0dc"/>`;
  if(t==='jito')return full+`<rect x="${cx-14}" y="148" width="28" height="15" fill="${SKIN}"/><path d="M${cx-13} 163 L${cx+13} 163" stroke="${LINE}" stroke-width="3.5" stroke-linecap="round"/>`;
  return full+lash;
}
function sprite(name){
  const e=EXP[name]||EXP.normal;
  const brow={n:`<path d="M109 143 Q122 139 135 143 M165 143 Q178 139 191 143"`,s:`<path d="M108 147 L134 141 M192 147 L166 141"`,a:`<path d="M108 140 L134 146 M192 140 L166 146"`}[e.brow]+` stroke="#c9607a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  const mouth={
    s:`<path d="M140 200 Q150 209 160 200" stroke="#a84a55" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    o:`<path d="M137 198 Q150 221 163 198 Z" fill="#c2414f"/><path d="M143 207 Q150 214 157 207 Q150 204 143 207" fill="#ff9aa8"/>`,
    p:`<path d="M143 205 Q150 199 157 205" stroke="#a84a55" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    sad:`<path d="M141 206 Q150 200 159 206" stroke="#a84a55" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    O:`<ellipse cx="150" cy="205" rx="5" ry="7" fill="#c2414f"/>`,
    w:`<path d="M141 203 q4.5 -4 9 0 t9 0" stroke="#a84a55" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
  }[e.mouth];
  return `<svg viewBox="0 0 300 620" xmlns="http://www.w3.org/2000/svg">
  <path d="M68 150 Q58 38 150 33 Q242 38 232 150 L250 370 Q200 395 150 388 Q100 395 50 370 Z" fill="${HAIR2}"/>
  <rect x="134" y="222" width="32" height="44" fill="#ffdccb"/>
  <path d="M74 275 Q48 300 44 445 L76 450 L92 330 Z M226 275 Q252 300 256 445 L224 450 L208 330 Z" fill="#27325a"/>
  <circle cx="60" cy="455" r="15" fill="${SKIN}"/><circle cx="240" cy="455" r="15" fill="${SKIN}"/>
  <path d="M60 468 L240 468 L266 620 L34 620 Z" fill="#c9455a"/>
  <path d="M95 468 L80 620 M130 468 L122 620 M170 468 L178 620 M205 468 L220 620" stroke="#a5344a" stroke-width="3"/>
  <path d="M76 272 Q150 238 224 272 L238 474 L62 474 Z" fill="#2f3a66"/>
  <path d="M122 254 L150 318 L178 254 Z" fill="#fff"/>
  <path d="M122 254 L150 318 L138 330 L104 262 Z M178 254 L150 318 L162 330 L196 262 Z" fill="#3d4a80"/>
  <path d="M150 296 l-24 -13 v26 z M150 296 l24 -13 v26 z" fill="#e63950"/><circle cx="150" cy="296" r="6" fill="#c42a40"/>
  <circle cx="150" cy="370" r="5" fill="#ffd400"/><circle cx="150" cy="420" r="5" fill="#ffd400"/>
  <rect x="186" y="330" width="34" height="16" rx="3" fill="#ffd400"/><text x="203" y="342" font-size="10" font-weight="bold" text-anchor="middle" fill="#222" font-family="sans-serif">PR部</text>
  <path d="M92 135 Q92 205 150 238 Q208 205 208 135 Q208 72 150 72 Q92 72 92 135Z" fill="${SKIN}"/>
  <ellipse cx="110" cy="190" rx="13" ry="7" fill="#ff8fa3" opacity="${e.blush*.7}"/><ellipse cx="190" cy="190" rx="13" ry="7" fill="#ff8fa3" opacity="${e.blush*.7}"/>
  ${eyeSvg(e.eye,122)}${eyeSvg(e.eye,178)}
  <path d="M84 142 Q78 58 150 53 Q222 58 216 142 Q204 102 184 96 Q178 124 162 100 Q150 128 136 100 Q122 126 112 98 Q94 110 84 142Z" fill="${HAIR}"/>
  <path d="M86 128 Q72 200 86 270 Q100 225 97 150Z M214 128 Q228 200 214 270 Q200 225 203 150Z" fill="${HAIR}"/>
  <path d="M150 55 Q138 18 172 24 Q156 32 160 56Z" fill="${HAIR}"/>
  <path d="M100 80 Q150 60 200 80" stroke="#ffc2cf" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
  <rect x="180" y="90" width="34" height="16" rx="3" fill="#ffd400" stroke="#fff" stroke-width="1.5" transform="rotate(12 197 98)"/>
  <text x="197" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="#222" font-family="sans-serif" transform="rotate(12 197 98)">AD</text>
  ${brow}${mouth}
  </svg>`;
}

/* =====================================================================
   背景（SVG）
   ===================================================================== */
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const R=(x,y,w,h,f,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${ex}/>`;
const TX=(x,y,s,t,f='#fff',ex='')=>`<text x="${x}" y="${y}" font-size="${s}" fill="${f}" font-weight="bold" text-anchor="middle" font-family="sans-serif" ${ex}>${t}</text>`;
const lg=(id,cs)=>`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${cs.map((c,i)=>`<stop offset="${i/(cs.length-1)}" stop-color="${c}"/>`).join('')}</linearGradient></defs>`;
const wrap=s=>`<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
const cloud=(x,y,k=1)=>`<g fill="#fff" opacity=".85"><ellipse cx="${x}" cy="${y}" rx="${70*k}" ry="${24*k}"/><ellipse cx="${x+40*k}" cy="${y-16*k}" rx="${46*k}" ry="${24*k}"/><ellipse cx="${x-36*k}" cy="${y-10*k}" rx="${36*k}" ry="${18*k}"/></g>`;
function bgGate(rain){
  let s=lg('sk',rain?['#566270','#a3adb8']:['#62bcff','#e2f5ff'])+R(0,0,1280,720,'url(#sk)');
  if(!rain)s+=cloud(220,110)+cloud(980,80,1.2)+cloud(700,160,.7);
  const wall=rain?'#cbc4b4':'#f6eedc';
  s+=R(585,120,110,120,wall)+`<polygon points="572,125 640,78 708,125" fill="#b5523b"/><circle cx="640" cy="172" r="27" fill="#fff" stroke="#555" stroke-width="4"/><path d="M640 172 V154 M640 172 H653" stroke="#333" stroke-width="4" stroke-linecap="round"/>`;
  s+=R(300,232,680,320,wall)+R(288,216,704,22,'#b5523b');
  for(let r=0;r<3;r++)for(let c=0;c<9;c++){if(r===2&&c===4)continue;s+=R(322+c*72,262+r*88,48,58,rain?'#ffe9a8':'#9fd3f0','stroke="#fff" stroke-width="4"');}
  s+=R(598,440,84,112,'#7a5a44')+R(638,440,4,112,'#5c4333');

function auInit(){
  if(AU.ctx){AU.ctx.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=AU.muted?0:.6;AU.master.connect(AU.ctx.destination);
  const w=AU.want;AU.name=null;music(w);
}
function note(dest,m,t,d,type,v){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=mtof(m);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.03);
}
function schedule(tr,bus,t0){
  const e=30/tr.bpm,bars=tr.mel.length/8;
  for(let b=0;b<bars;b++){
    const ch=tr.ch[b%tr.ch.length],tb=t0+b*8*e;
    for(let i=0;i<8;i++){
      const t=tb+i*e,m=tr.mel[b*8+i];
      if(m){let len=1;while(i+len<8&&!tr.mel[b*8+i+len])len++;note(bus,m,t,e*(tr.style==='soft'?len+.6:Math.min(len,2)*.9),tr.w,tr.v);}
      if(tr.style==='pop'){
        if(i%2===0)note(bus,ch[0]-12+((i/2)%2?7:0),t,e*1.6,'triangle',.16);
        else ch.forEach(n=>note(bus,n,t,e*.5,'square',.018));
      }else{
        note(bus,ch[[0,1,2,1][i%4]]+(i>=4?12:0),t,e*1.8,'triangle',.06);
        if(i===0)note(bus,ch[0]-12,t,e*7.5,'sine',.14);
      }
    }
  }
  return bars*8*e;
}
function music(name){
  AU.want=name;
  if(!AU.ctx||AU.name===name)return;
  const c=AU.ctx;clearTimeout(AU.timer);
  if(AU.bus){const old=AU.bus;old.gain.setValueAtTime(old.gain.value,c.currentTime);old.gain.linearRampToValueAtTime(0,c.currentTime+.25);setTimeout(()=>old.disconnect(),400);AU.bus=null;}
  AU.name=name;if(!name||!TRACKS[name])return;
  const tr=TRACKS[name],bus=c.createGain();bus.connect(AU.master);AU.bus=bus;
  let t0=c.currentTime+.15;
  const loop=()=>{t0+=schedule(tr,bus,t0);AU.timer=setTimeout(loop,Math.max(50,(t0-c.currentTime-.4)*1000));};
  loop();
}
function sfx(kind){
  if(!AU.ctx)return;
  const t=AU.ctx.currentTime,seq={pick:[84,91],up:[76,79,84,88],down:[67,63,58]}[kind]||[];
  seq.forEach((m,i)=>note(AU.master,m,t+i*.07,.18,kind==='down'?'triangle':'square',.08));
}

const MEM={};
const store={
  get(k){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v);}catch(e){}return MEM[k];},
  set(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
  del(k){delete MEM[k];try{localStorage.removeItem(k);}catch(e){}}
};

function setBg(n){S.bg=n;$('bg').innerHTML=BG[n]();music(BGM[n]);}
function setExp(n){$('sprite').innerHTML=sprite(n);}
function showSprite(v){$('sprite').classList.toggle('off',!v);}
function side(v){$('sprite').classList.toggle('side',v);}
const WD=['','月','火','水','木','金','土','日'];
function hud(label){
  if(label!==undefined)S.label=label;
  $('hudL').textContent=`${S.day}日目（${WD[S.day]}） ${S.label||''}`;
  $('fbar').firstElementChild.style.width=S.f+'%';
  $('fnum').textContent=S.f;
  $('adnum').textContent=`📺 ${S.ads}/5`;
}
function fx(o){
  if(!o)return;
  const before=S.f;
  S.f=Math.max(0,Math.min(100,S.f+(o.f||0)));S.h+=(o.h||0);
  const d=S.f-before;
  if(o.f){sfx(o.f>0?'up':'down');const t=$('toast');t.textContent=(o.f>0?'♥ +':'♥ ')+o.f;t.style.color=o.f>0?'#ff5c8a':'#5c8aff';t.classList.remove('go');void t.offsetWidth;t.classList.add('go');}
  hud();return d;
}
function say(name,text){
  text=text.replace('{ads}',S.ads);
  return new Promise(res=>{
    const nm=$('nm'),msg=$('msg'),nx=$('nx');
    nm.textContent=name;nm.style.visibility=name?'visible':'hidden';
    nm.style.background=name==='あなた'?'#4a78d0':'#ff5c8a';
    msg.style.color=name?'#fff':'#dfe6ff';
    let i=0;msg.textContent='';nx.hidden=true;const g=GEN;
    const done=()=>{clearInterval(tm);if(g!==GEN)return;msg.textContent=text;nx.hidden=false;onAdv=()=>{onAdv=null;res();};};
    const tm=setInterval(()=>{if(g!==GEN){clearInterval(tm);return;}i++;msg.textContent=text.slice(0,i);if(i>=text.length)done();},FAST?2:26);
    onAdv=done;
  });
}
function pick(btns){
  return new Promise(res=>{
    const box=$('choices');box.innerHTML='';
    btns.forEach((b,i)=>{const el=document.createElement('button');el.className='ch'+(b.ad?' adbtn':'');el.innerHTML=b.label;
      el.onclick=e=>{e.stopPropagation();sfx('pick');box.hidden=true;side(false);res(i);};box.appendChild(el);});
    side(true);box.hidden=false;
  });
}
const AD_LABEL='📺 広告を見る<small>（好感度 大UP！！）</small>';
async function watchAd(gain){
  await showAd(S.ads===4);
  S.ads++;fx({f:gain});
}
async function quotaCheck(){
  if(S.ads>=5&&!S.quota){S.quota=true;await run(QUOTA);}
}
async function choose(opts,adLines){
  const i=await pick([...opts.map(o=>({label:o[0]})),{label:AD_LABEL,ad:true}]);
  if(i===opts.length){await watchAd(5);await run(adLines);await quotaCheck();}
  else{fx(opts[i][1]);await run(opts[i][2]);}
}
async function run(lines){
  for(const L of lines){
    switch(L[0]){
      case 'bg':setBg(L[1]);showSprite(!!L[2]);break;
      case 'show':showSprite(true);break;
      case 'hide':showSprite(false);break;
      case 't':setExp(L[1]);showSprite(true);await say('告葉',L[2]);break;
      case 'y':await say('あなた',L[1]);break;
      case 'm':await say('',L[1]);break;
      case 'fx':fx(L[1]);break;
      case 'c':await choose(L[1],L[2]);break;
    }
  }
}
function dayCard(t,s){
  const g=GEN;
  return new Promise(res=>{$('cardT').textContent=t;$('cardS').textContent=s||'';$('card').classList.add('on');
    setTimeout(()=>{if(g!==GEN)return;$('card').classList.remove('on');setTimeout(()=>{if(g===GEN)res();},FAST?50:500);},FAST?100:1500);});
}

async function actionMenu(n){
  hud(`自由行動 ${n}/2`);
  setExp(S.f>=60?'smile':'normal');showSprite(true);
  const pool=S.f>=60&&Math.random()<.5?NUDGE_HI:NUDGE;
  const nm=$('nm');nm.textContent='告葉';nm.style.visibility='visible';nm.style.background='#ff5c8a';
  $('msg').style.color='#fff';$('msg').textContent=pool[Math.floor(Math.random()*pool.length)];$('nx').hidden=true;
  const i=await pick([{label:'💬 話しかける'},{label:'🚶 デートに誘う'},{label:'🎁 プレゼントを渡す'},{label:AD_LABEL,ad:true}]);
  if(i===3){
    await watchAd(8);
    const r=AD_REACT[S.ads];
    if(S.ads===5&&!S.quota){/* ノルマ達成イベントが反応を兼ねる */}
    else if(r)await run(r);
    else await run(AD_MORE[(S.ads)%AD_MORE.length]);
    await quotaCheck();
  }else{
    const key=['talk','date','gift'][i],arr=[TALK,DATE,GIFT][i],fb=[TALK_FB,DATE_FB,GIFT_FB][i],gain=[{f:3,h:2},{f:4,h:3},{f:3,h:2}][i];
    const k=S.used[key]++;
    await run(k<arr.length?arr[k]:fb);
    fx(gain);
  }
}

/* ---------- 進行・セーブ ---------- */
function saveGame(phase){store.set('kokoku_save',{phase,S:JSON.parse(JSON.stringify(S)),adOrder});}
async function game(sv){
  ++GEN;onAdv=null;
  if(sv){Object.assign(S,sv.S);adOrder=sv.adOrder||[];}
  else{Object.assign(S,{day:1,f:10,h:0,ads:0,quota:false,label:'',used:{talk:0,date:0,gift:0}});adOrder=[];}
  let phase=sv?sv.phase:0; // 0=その日の最初 / 1=自由行動1の前 / 2=自由行動2の前
  $('end').hidden=true;$('gal').hidden=true;$('title').hidden=true;$('ad').hidden=true;$('home').hidden=false;
  $('choices').hidden=true;side(false);$('card').classList.remove('on');
  $('msg').textContent='';$('nm').style.visibility='hidden';$('nx').hidden=true;showSprite(false);
  for(;S.day<=6;S.day++){
    if(phase===0){
      setBg(DAYS[S.day][0][1]);showSprite(false);hud('');saveGame(0);
      await dayCard(`${S.day}日目`,`${WD[S.day]}曜日 ／ ノルマ期限まで あと${7-S.day}日`);
      await run(DAYS[S.day]);
    }else{setBg(S.bg);hud();}
    if(phase<=1){saveGame(1);await actionMenu(1);}
    saveGame(2);await actionMenu(2);
    phase=0;
  }
  S.day=7;setBg('roof');showSprite(false);hud('');saveGame(0);
  await dayCard('最終日','日曜日 ／ 屋上');
  await run(DAY7);
  await ending();
}
function titleScreen(){
  ++GEN;onAdv=null; // 進行中のシナリオを止める（進行は自動セーブ済み）
  const got=store.get('kokoku_ends')||[],sv=store.get('kokoku_save');
  $('ends').textContent=got.length?`回収済みエンディング：${got.length} / 5`:'';
  $('contBtn').hidden=!sv;
  if(sv)$('contBtn').textContent=`▶ つづきから（${sv.S.day>=7?'最終日':sv.S.day+'日目'}）`;
  $('titleGirl').innerHTML=sprite('ad');
  $('end').hidden=true;$('gal').hidden=true;$('ad').hidden=true;$('choices').hidden=true;side(false);$('card').classList.remove('on');
  $('home').hidden=true;$('title').hidden=false;music('day');
}
$('startBtn').onclick=e=>{e.stopPropagation();auInit();game();};
$('contBtn').onclick=e=>{e.stopPropagation();auInit();const sv=store.get('kokoku_save');if(sv)game(sv);};
$('galBtn').onclick=e=>{e.stopPropagation();gallery();};
$('endImg').onclick=()=>{$('endPanel').hidden=!$('endPanel').hidden;};
$('galBack').onclick=()=>{$('gal').hidden=true;};
$('home').onclick=e=>{e.stopPropagation();sfx('pick');titleScreen();};
$('endBtn').onclick=e=>{e.stopPropagation();if(endBack)endBack();};
$('title').addEventListener('click',e=>e.stopPropagation());
$('end').addEventListener('click',e=>e.stopPropagation());
$('gal').addEventListener('click',e=>e.stopPropagation());
setBg('gate');titleScreen();
</script>
</body>
</html>
